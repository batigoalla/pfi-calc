<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>計算機</title>
<style>
:root{--bg:#f3f6f5;--card:#ffffff;--ink:#13201d;--muted:#5a6a66;--rule:#cfd9d5;--accent:#0d6b59;--on-accent:#ffffff;--neg:#b03f2c;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0e1513;--card:#151e1b;--ink:#e4ece9;--muted:#97a8a3;--rule:#33423d;--accent:#4fc4a6;--on-accent:#0e1513;--neg:#f08a74;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 "PingFang HK","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:20px}
p{margin:0;color:var(--muted);font-size:14px}
input[type=password]{width:100%;font:inherit;font-size:17px;padding:11px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
label.rm{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
button{font:inherit;font-weight:600;padding:11px;border:0;border-radius:8px;background:var(--accent);color:var(--on-accent);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.err{color:var(--neg);font-size:14px;min-height:1.5em}
</style>
</head>
<body>
<form id="f" hidden>
  <h1>請輸入密碼</h1>
  <p>此頁面已加密，輸入正確密碼後才會顯示內容。</p>
  <input id="pw" type="password" autocomplete="current-password" aria-label="密碼" required>
  <label class="rm"><input id="rm" type="checkbox" checked> 記住呢部機（共用電腦請勿剔選）</label>
  <button id="go" type="submit">開啟</button>
  <div class="err" id="err" role="alert"></div>
</form>
